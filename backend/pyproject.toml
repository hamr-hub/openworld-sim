[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openworld-sim"
version = "0.1.0"
description = "Open-world multi-agent social simulation — world kernel + agents"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
openworld-headless = "openworld.headless:main"
openworld-server = "openworld.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openworld*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"